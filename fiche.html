<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fiche membre – N-TURF</title>
<meta name="theme-color" content="#0D1E3D">
<meta name="robots" content="noindex">
<link rel="manifest" href="/manifest.webmanifest?v=2">
<link rel="icon" href="/icone-nturf-192.png">
<link rel="stylesheet" href="/style.css?v=20261127f">
<style>.fl{display:inline-block;width:10px;height:10px;border-radius:50%;background:#b9c3d3;margin-right:6px}.fl.on{background:#1fa54a}.bio{white-space:pre-wrap}.pos{color:#13702f}.neg{color:#b3121f}</style>
</head>
<body data-page="membres">
<main>
<div id="refus" class="note" hidden></div>
<section class="card" id="zone" hidden>
<h1 id="ps"></h1>
<p id="etat" class="note2"></p>
<table class="st" id="tb"></table>
<p class="bio" id="bio"></p>
<p id="act"></p>
</section>
<section class="card" id="pmz" hidden><h2 style="margin:0 0 6px">Ses pronos, jeu par jeu</h2><div class="pills"><button type="button" class="pill on" data-pp="mois">Ce mois-ci</button><button type="button" class="pill" data-pp="tout">Depuis le début</button></div><div id="pmb"></div><p class="note2">Mise de 1 € par pari, aux vrais rapports PMU. Le net est le gain mise déduite.</p><p><a href="/pronos-membres.html">Voir les pronos des membres</a></p></section>
</main>
<script src="/site.js?v=20261127r"></script>
<script>
function $(i){ return document.getElementById(i); }
function E(s){ return String(s||'').replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
var P = new URLSearchParams(location.search).get('p') || '';
fetch('/api/social/fiche?pseudo=' + encodeURIComponent(P), {credentials:'same-origin'}).then(function(r){ return r.json().then(function(d){ return {ok:r.ok, d:d}; }); }).then(function(x){
  var d = x.d;
  if (!x.ok) { $('refus').hidden = false; $('refus').innerHTML = E(d.erreur) + (x.d.erreur && /Connectez/.test(d.erreur) ? ' <a href="/inscription.html#connexion">Se connecter</a>' : ''); return; }
  $('zone').hidden = false; document.title = d.pseudo + ' – N-TURF';
  $('ps').innerHTML = '<span class="fl' + (d.enLigne ? ' on' : '') + '"></span><span class="psn">' + E(d.pseudo) + '</span>' + (d.modo ? ' <small style="color:#d8232f">modérateur</small>' : '');
  $('etat').textContent = (d.enLigne ? 'En ligne' : 'Hors ligne') + ' · membre depuis le ' + new Date((d.inscrit || '').replace(' ', 'T') + 'Z').toLocaleDateString('fr-FR');
  var rows = [['Région', d.region], ['Joue depuis', d.depuis], ['Jeux préférés', d.jeux]].filter(function(r){ return r[1]; });
  $('tb').innerHTML = rows.map(function(r){ return '<tr><td>' + r[0] + '</td><td><b>' + E(r[1]) + '</b></td></tr>'; }).join('');
  $('bio').textContent = d.bio || (rows.length ? '' : (d.moi ? 'Ta fiche est vide.' : 'Ce membre n\'a pas encore rempli sa fiche.'));
  var a = '';
  if (d.moi) a = '<a class="btn" href="/compte.html#fiche">Modifier ma fiche</a>';
  else if (!d.contact) a = '<a class="btn" href="/messages.html?avec=' + encodeURIComponent(d.pseudo) + '">✉ Lui écrire</a> <span class="note2">Ton premier message sera une demande de contact : il pourra l\'accepter ou la refuser.</span>';
  else if (d.contact.statut === 'accepte') a = '<a class="btn" href="/messages.html?avec=' + encodeURIComponent(d.pseudo) + '">✉ Messages</a>';
  else if (d.contact.statut === 'attente' && d.contact.parMoi) a = '<span class="note2">Ta demande de contact attend sa réponse.</span>';
  else if (d.contact.statut === 'attente') a = '<a class="btn" href="/messages.html?avec=' + encodeURIComponent(d.pseudo) + '">Voir sa demande de contact</a>';
  a = '<a class="btn ghost" href="/fiche-jour.html?p=' + encodeURIComponent(d.pseudo) + '">📋 ' + (d.moi ? 'Ma fiche du jour' : 'Sa fiche du jour') + '</a> ' + a;
  $('act').innerHTML = a;
  fetch('/api/pm?bilan=' + encodeURIComponent(d.pseudo), {credentials:'same-origin'}).then(function(r){ return r.ok ? r.json() : null; }).then(function(b){
    if (!b) return;
    if (b.verrou) { $('pmz').hidden = false; $('pmb').innerHTML = '<div class="note">🔒 Les stats des autres membres sont réservées à ceux qui donnent au moins ' + b.verrou.min + ' pronos par jour. Aujourd\'hui, tu en as donné ' + b.verrou.n + ' sur ' + b.verrou.min + '.</div>'; document.querySelectorAll('[data-pp]').forEach(function(x){ x.hidden = true; }); return; }
    var TYPES = {SG:'Simple gagnant', SP:'Simple placé', CG:'Couplé gagnant', CP:'Couplé placé', CO:'Couplé ordre', TR:'Trio', TO:'Trio ordre', DQ:'2 sur 4', M4:'Multi en 4', S4:'Super 4 ordre', RP:'Report'};
    function Fe(x){ return (Math.round(x * 100) / 100).toFixed(2).replace('.', ',') + ' €'; }
    function Fn(x){ return (x > 0 ? '+' : x < 0 ? '−' : '') + Fe(Math.abs(x)); }
    function cl(x){ return x > 0 ? 'pos' : x < 0 ? 'neg' : ''; }
    function voir(k){
      document.querySelectorAll('[data-pp]').forEach(function(x){ x.classList.toggle('on', x.getAttribute('data-pp') === k); });
      var B = b[k], T = B.types, m = 0, g = 0; T.forEach(function(x){ m += x.mise; g += x.gains; }); var n = Math.round((g - m) * 100) / 100;
      $('pmb').innerHTML = T.length ? '<p class="note2">' + B.pronos + ' prono' + (B.pronos > 1 ? 's' : '') + ' vérifié' + (B.pronos > 1 ? 's' : '') + '</p><table class="st"><tr><th>Jeu</th><th>Paris</th><th>Gagnés</th><th>Mise</th><th>Net</th></tr>' + T.map(function(x){ return '<tr><td>'+TYPES[x.t]+'</td><td>'+x.paris+'</td><td>'+x.gagnes+'</td><td>'+Fe(x.mise)+'</td><td class="'+cl(x.net)+'"><b>'+Fn(x.net)+'</b></td></tr>'; }).join('') + '<tr><td><b>Total</b></td><td></td><td></td><td><b>'+Fe(m)+'</b></td><td class="'+cl(n)+'"><b>'+Fn(n)+'</b></td></tr></table>' : '<p class="empty">Pas encore de prono vérifié sur cette période.</p>';
    }
    document.querySelectorAll('[data-pp]').forEach(function(x){ x.onclick = function(){ voir(x.getAttribute('data-pp')); }; });
    $('pmz').hidden = false; voir('mois');
  }).catch(function(){});
});
</script>
</body>
</html>
