<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pronostics – N-TURF</title>
<meta name="theme-color" content="#0e2040">
<meta name="robots" content="noindex">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
</head>
<body data-page="membres">
<main>
<h1>Pronostics</h1>
<div id="refus" class="note" hidden>🔒 Réservé aux membres. <a href="/inscription.html">S'inscrire gratuitement</a> ou <a href="/inscription.html#connexion">se connecter</a>.</div>
<div id="zone" hidden>
<nav class="tabs" style="padding:0 0 10px"><a href="#" id="oQ" class="on">Quinté+</a><a href="#" id="oC">Course par course</a></nav>
<section class="card" id="sQ"><div id="rendu"><p class="empty">Chargement…</p></div></section>
<section class="card" id="sC" hidden><div id="renduC"><p class="empty">Chargement…</p></div></section>
</div>
</main>
<script src="/site.js"></script>
<script src="/quinte.js"></script>
<script>
fetch('/api/membres/quinte', {credentials:'same-origin'})
  .then(function(r){ return r.json().then(function(d){ return {ok:r.ok, d:d}; }); })
  .then(function(x){
    if (!x.ok) { document.getElementById('refus').hidden = false; return; }
    document.getElementById('zone').hidden = false;
    document.getElementById('rendu').innerHTML = NT.afficher(x.d.quinte);
    return fetch('/api/membres/cpc', {credentials:'same-origin'}).then(function(r){ return r.json(); }).then(function(d){
      var el = document.getElementById('renduC'), cpc = d.cpc;
      function dessiner(live){
        var on = el.querySelector('nav.inner a.on'), ong = on ? parseInt(on.getAttribute('data-r'), 10) : 0;
        var ouverts = [].map.call(el.querySelectorAll('details[open]'), function(x){ return x.parentNode.id; });
        el.innerHTML = NT.afficherCpc(cpc, ong, live); NT.brancherOnglets(el);
        ouverts.forEach(function(id){ var x = document.getElementById(id); if (x) { var dt = x.querySelector('details'); if (dt) dt.open = true; } });
      }
      dessiner();
      function maj(){ NT.chargerLive(cpc, dessiner); }
      maj(); setInterval(maj, 60000);
    });
  }).catch(function(){ document.getElementById('refus').hidden = false; });
function onglet(q){
  document.getElementById('sQ').hidden = !q; document.getElementById('sC').hidden = q;
  document.getElementById('oQ').className = q ? 'on' : ''; document.getElementById('oC').className = q ? '' : 'on';
}
document.getElementById('oQ').onclick = function(e){ e.preventDefault(); onglet(true); };
document.getElementById('oC').onclick = function(e){ e.preventDefault(); onglet(false); };
if (location.hash === '#cpc') onglet(false);
</script>
</body>
</html>
