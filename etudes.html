<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Études – N-TURF</title>
<meta name="theme-color" content="#0D1E3D">
<link rel="manifest" href="/manifest.webmanifest?v=2">
<link rel="icon" href="/icone-nturf-192.png">
<link rel="stylesheet" href="/style.css?v=20261127a">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4848326247118929" crossorigin="anonymous"></script>
</head>
<body data-page="membres">
<main>
<h1>Études</h1>
<div id="refus" class="note" hidden>🔒 Réservé aux membres. <a href="/inscription.html">S'inscrire gratuitement</a> ou <a href="/inscription.html#connexion">se connecter</a>.</div>
<div id="zone" hidden>
<nav class="tabs" style="padding:0 0 10px"><a href="#etquinte" data-g="etquinte" class="on">Études Quinté+</a><a href="#etr1" data-g="etr1">Études Réunion 1</a><a href="#etout" data-g="etout">Études outsiders</a><a href="#ettrot" data-g="ettrot">Études trotteurs</a></nav>
<p class="lead" id="titre"></p>
<div id="pages"></div>
<p class="note2">Touche une étude pour l'agrandir.</p>
</div>
</main>
<div id="lb" hidden><img alt=""></div>
<script src="/site.js?v=20261127a"></script>
<script>

function jourFr(k){ return new Date(Date.now() + k*86400000).toLocaleDateString('fr-FR', {timeZone:'Europe/Paris', day:'2-digit', month:'2-digit', year:'numeric'}); }
var TJ = 0, TJauto = true;
function trot(el, h){
  var img = '';
  if (h && h.n) for (var i = 0; i < h.n; i++) img += '<img class="hpage" loading="lazy" src="'+(h.depot ? '/etudes-img/ettrot-'+(i+1)+'.jpg?v='+encodeURIComponent(h.v) : '/api/membres/hippo-image?g=ettrot&i='+i+'&v='+encodeURIComponent(h.v||''))+'" alt="">';
  el.innerHTML = img + '<div class="pills" style="margin:6px 0 10px"><button type="button" class="pill'+(TJ===0?' on':'')+'" data-j="0">Aujourd\'hui ('+jourFr(0)+')</button><button type="button" class="pill'+(TJ===1?' on':'')+'" data-j="1">Demain ('+jourFr(1)+')</button></div>' +
    '<p class="note2">Formule du membre, calculée automatiquement sur toutes les courses de trot : |limite − gains| ÷ limite × dernière place × cote. Plus la note est petite, mieux c\'est. Deux classements : la limite des conditions (le recul s\'il y en a un) et le recul fictif. Les cotes sont celles du PMU (cote du jour), ajoutées dès qu\'elles sont ouvertes.</p><div id="trotZone"><p class="empty">Calcul en cours…</p></div>';
  el.querySelectorAll('[data-j]').forEach(function(b){ b.onclick = function(){ TJauto = false; TJ = +b.getAttribute('data-j'); trot(el, h); }; });
  fetch('/api/membres/trot?date=' + encodeURIComponent(jourFr(TJ)), {credentials:'same-origin'}).then(function(r){ return r.json(); }).then(function(d){
    var z = document.getElementById('trotZone');
    if (d.erreur) { z.innerHTML = '<p class="empty">' + d.erreur + '</p>'; return; }
    // le soir, quand toutes les courses du jour sont courues, on passe tout seul à demain
    if (TJauto && TJ === 0 && d.reunions && d.reunions.length && d.reunions.every(function(r){ return r.courses.every(function(c){ return c.arrivee && c.arrivee.length; }); })) { TJauto = false; TJ = 1; trot(el, h); return; }
    if (!d.reunions || !d.reunions.length) { z.innerHTML = '<p class="empty">Pas de course de trot en France ce jour-là.</p>'; return; }
    var E = function(x){ return String(x).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
    var fmt = function(n){ return n ? Number(n).toLocaleString('fr-FR') + ' €' : '–'; };
    z.innerHTML = d.reunions.map(function(r){
      return '<h2 style="margin:18px 0 6px">' + E(r.h) + '</h2>' + r.courses.map(function(c){
        var arr = c.arrivee || [];
        var liste = function(t, L){
          if (!L.length) return '<p class="note2">' + t + ' : limite introuvable dans les conditions.</p>';
          var top8 = L.slice(0, 8).map(function(x){ return x.n; });
          var dans = arr.length ? arr.filter(function(n){ return top8.indexOf(n) >= 0; }).length : null;
          return '<p style="margin:4px 0"><b>' + t + '</b> : ' + L.map(function(x, i){
            var on = arr.indexOf(x.n) >= 0, s = (i === 8 ? '| ' : '') + x.n;
            return on ? '<b style="color:var(--red,#c0392b)">' + s + '</b>' : s;
          }).join(' - ') + (dans !== null ? ' <span class="note2">(' + dans + ' arrivé' + (dans > 1 ? 's' : '') + ' dans les 8 premiers)</span>' : '') + '</p>';
        };
        return '<section class="card" style="padding:12px 14px;margin:8px 0"><h3 style="margin:0 0 4px">C' + c.c + ' – ' + E(c.nom) + '</h3>' +
          '<p class="note2" style="margin:0 0 6px">' + c.partants + ' partants · limite ' + (c.typeLimite === 'recul' ? 'du recul ' : c.typeLimite ? 'des conditions ' : '') + fmt(c.limite) + ' · recul fictif ' + fmt(c.fictif) + (c.cotes ? '' : ' · cotes pas encore ouvertes') + '</p>' +
          liste('Conditions', c.conditions) + liste('Recul fictif', c.reculFictif) +
          (arr.length ? '<p style="margin:4px 0">Arrivée : <b>' + arr.join(' - ') + '</b></p>' : '') + '</section>';
      }).join('');
    }).join('');
  }).catch(function(){ document.getElementById('trotZone').innerHTML = '<p class="empty">Données PMU indisponibles pour le moment.</p>'; });
}
var vv = function(h){ return h && h.v ? parseInt(h.v, 36) || 0 : 0; };
fetch('/api/membres/etudes', {credentials:'same-origin'})
  .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
  .then(function(d){
    // études déposées par Claude (dépôt) : on garde la plus récente des deux sources
    return fetch('/etudes-img/jour.json?t=' + Date.now(), {credentials:'same-origin'}).then(function(r){ return r.ok ? r.json() : {}; }).catch(function(){ return {}; })
      .then(function(c){ Object.keys(c || {}).forEach(function(g){ if (vv(c[g]) > vv(d[g])) { c[g].depot = 1; d[g] = c[g]; } }); return d; });
  })
  .then(function(d){
    // une étude d'un autre jour que le Quinté+ en ligne ne s'affiche plus
    var QD = d.quinteDate || '', qIso = /^\d{2}\/\d{2}\/\d{4}$/.test(QD) ? QD.split('/').reverse().join('-') : '';
    function jourEtude(h){
      if (h.date && /^\d{2}\/\d{2}\/\d{4}$/.test(h.date)) return { iso: h.date.split('/').reverse().join('-'), sur: 1 };
      var m = String(h.titre || '').match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?/);
      if (m) return { iso: (m[3] || qIso.slice(0, 4)) + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[1]).slice(-2) };
      var t = parseInt(h.v, 36); return t ? { iso: new Date(t).toLocaleDateString('fr-CA', {timeZone:'Europe/Paris'}) } : null;
    }
    if (qIso) ['etquinte', 'etr1', 'etout', 'ettrot'].forEach(function(g){ var h = d[g]; if (!h || !h.n) return; var j = jourEtude(h); if (j && (j.sur ? j.iso !== qIso : j.iso < qIso)) d[g] = null; });
    document.getElementById('zone').hidden = false;
    var el = document.getElementById('pages'), lb = document.getElementById('lb');
    function montrer(g){
      document.querySelectorAll('nav.tabs a[data-g]').forEach(function(a){ a.className = a.getAttribute('data-g') === g ? 'on' : ''; });
      var h = d[g];
      document.getElementById('titre').textContent = h && h.titre || '';
      if (g === 'ettrot') { el.innerHTML = (h && h.n ? '' : '') ; trot(el, h); return; }
      if (!h || !h.n) { el.innerHTML = '<p class="empty">L\'étude du jour arrive.</p>'; return; }
      var t = ''; for (var i = 0; i < h.n; i++) t += '<img class="hpage" loading="lazy" src="'+(h.depot ? '/etudes-img/'+g+'-'+(i+1)+'.jpg?v='+encodeURIComponent(h.v) : '/api/membres/hippo-image?g='+g+'&i='+i+'&v='+encodeURIComponent(h.v||''))+'" alt="Étude '+(i+1)+'">';
      el.innerHTML = t;
      el.querySelectorAll('img').forEach(function(im){ im.onclick = function(){ lb.querySelector('img').src = im.src; lb.hidden = false; }; });
    }
    lb.onclick = function(){ lb.hidden = true; };
    document.querySelectorAll('nav.tabs a[data-g]').forEach(function(a){ a.onclick = function(e){ e.preventDefault(); montrer(a.getAttribute('data-g')); history.replaceState(null, '', '#' + a.getAttribute('data-g')); }; });
    var hh = location.hash.slice(1); montrer(['etr1','etout','ettrot'].indexOf(hh) >= 0 ? hh : 'etquinte');
  }).catch(function(){ document.getElementById('refus').hidden = false; });
</script>
</body>
</html>
