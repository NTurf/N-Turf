<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Études – N-TURF</title>
<meta name="theme-color" content="#0D1E3D">
<link rel="manifest" href="/manifest.webmanifest?v=2">
<link rel="icon" href="/icone-nturf-192.png">
<link rel="stylesheet" href="/style.css?v=20261128a">
</head>
<body data-page="membres">
<main>
<h1>Études</h1>
<div id="refus" class="note" hidden>🔒 Réservé aux membres. <a href="/inscription.html">S'inscrire gratuitement</a> ou <a href="/inscription.html#connexion">se connecter</a>.</div>
<div id="zone" hidden>
<nav class="tabs" style="padding:0 0 10px;flex-wrap:wrap"><a href="#etquinte" data-g="etquinte" class="on">Étude Quinté+</a><a href="#etout" data-g="etout">Outsiders</a><a href="#ettrot" data-g="ettrot">Trotteurs</a><a href="#etperfs" data-g="etperfs">5 dernières perfs</a></nav>
<p class="lead" id="titre"></p>
<div id="pages"></div>
</div>
</main>
<div id="lb" hidden><img alt=""></div>
<script src="/site.js?v=20261128a"></script>
<script>

function jourFr(k){ return new Date(Date.now() + k*86400000).toLocaleDateString('fr-FR', {timeZone:'Europe/Paris', day:'2-digit', month:'2-digit', year:'numeric'}); }
var TJ = 0, TJauto = true;
function trot(el, h){
  var img = '';
  if (h && h.n) for (var i = 0; i < h.n; i++) img += '<img class="hpage" loading="lazy" src="'+(h.depot ? '/etudes-img/ettrot-'+(i+1)+'.jpg?v='+encodeURIComponent(h.v) : '/api/membres/hippo-image?g=ettrot&i='+i+'&v='+encodeURIComponent(h.v||''))+'" alt="">';
  el.innerHTML = img + '<div class="pills" style="margin:6px 0 10px"><button type="button" class="pill'+(TJ===0?' on':'')+'" data-j="0">Aujourd\'hui ('+jourFr(0)+')</button><button type="button" class="pill'+(TJ===1?' on':'')+'" data-j="1">Demain ('+jourFr(1)+')</button></div>' +
    '<p class="note2">Formule du membre, calculée automatiquement sur toutes les courses de trot : |limite − gains| ÷ limite × dernière place × cote. Plus la note est petite, mieux c\'est. Deux classements : la limite des conditions (le recul s\'il y en a un) et le recul fictif. Les cotes sont celles du PMU (cote du jour), ajoutées dès qu\'elles sont ouvertes.</p><div id="trotZone"><p class="empty">Calcul en cours…</p></div>';
  el.querySelectorAll('[data-j]').forEach(function(b){ b.onclick = function(){ TJauto = false; TJ = +b.getAttribute('data-j'); trot(el, h); }; });
  fetch('/api/membres/trot?date=' + encodeURIComponent(jourFr(TJ)), {credentials:'same-origin'}).then(function(r){ return r.json(); }).then(function(d){
    var z = document.getElementById('trotZone');
    if (d.erreur) { z.innerHTML = '<p class="empty">' + d.erreur + '</p>'; return; }
    // le soir, quand toutes les courses du jour sont courues, on passe tout seul à demain
    if (TJauto && TJ === 0 && d.reunions && d.reunions.length && d.reunions.every(function(r){ return r.courses.every(function(c){ return c.arrivee && c.arrivee.length; }); })) { TJauto = false; TJ = 1; trot(el, h); return; }
    if (!d.reunions || !d.reunions.length) { z.innerHTML = '<p class="empty">Pas de course de trot en France ce jour-là.</p>'; return; }
    var E = function(x){ return String(x).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
    var fmt = function(n){ return n ? Number(n).toLocaleString('fr-FR') + ' €' : '–'; };
    z.innerHTML = d.reunions.map(function(r){
      return '<h2 style="margin:18px 0 6px">' + E(r.h) + '</h2>' + r.courses.map(function(c){
        var arr = c.arrivee || [];
        var liste = function(t, L){
          if (!L.length) return '<p class="note2">' + t + ' : limite introuvable dans les conditions.</p>';
          var top8 = L.slice(0, 8).map(function(x){ return x.n; });
          var dans = arr.length ? arr.filter(function(n){ return top8.indexOf(n) >= 0; }).length : null;
          return '<p style="margin:4px 0"><b>' + t + '</b> : ' + L.map(function(x, i){
            var on = arr.indexOf(x.n) >= 0, s = (i === 8 ? '| ' : '') + x.n;
            return on ? '<b style="color:var(--red,#c0392b)">' + s + '</b>' : s;
          }).join(' - ') + (dans !== null ? ' <span class="note2">(' + dans + ' arrivé' + (dans > 1 ? 's' : '') + ' dans les 8 premiers)</span>' : '') + '</p>';
        };
        return '<section class="card" style="padding:12px 14px;margin:8px 0"><h3 style="margin:0 0 4px">C' + c.c + ' – ' + E(c.nom) + '</h3>' +
          '<p class="note2" style="margin:0 0 6px">' + c.partants + ' partants · limite ' + (c.typeLimite === 'recul' ? 'du recul ' : c.typeLimite ? 'des conditions ' : '') + fmt(c.limite) + ' · recul fictif ' + fmt(c.fictif) + (c.cotes ? '' : ' · cotes pas encore ouvertes') + '</p>' +
          liste('Conditions', c.conditions) + liste('Recul fictif', c.reculFictif) +
          (arr.length ? '<p style="margin:4px 0">Arrivée : <b>' + arr.join(' - ') + '</b></p>' : '') + '</section>';
      }).join('');
    }).join('');
  }).catch(function(){ document.getElementById('trotZone').innerHTML = '<p class="empty">Données PMU indisponibles pour le moment.</p>'; });
}
var E2 = function(x){ return String(x == null ? '' : x).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };

// 5 DERNIÈRES PERFS : méthode proposée par un membre, calculée sur toutes les courses françaises du jour
var PJ = 0, PJauto = true;
function perfs(el){
  el.innerHTML = '<div class="pills" style="margin:6px 0 10px"><button type="button" class="pill'+(PJ===0?' on':'')+'" data-pj="0">Aujourd\'hui ('+jourFr(0)+')</button><button type="button" class="pill'+(PJ===1?' on':'')+'" data-pj="1">Demain ('+jourFr(1)+')</button></div>' +
    '<p class="note2"><b>Méthode proposée par un membre, en projet d\'étude.</b> Pour chaque cheval : ses 5 dernières places (au-delà de la 10e, non placé, disqualifié ou tombé = 10 ; une course qui manque compte aussi 10), additionnées puis divisées par 5. On classe de la plus petite note à la plus grande. Suivi : le 1er de l\'étude joué 1 € gagnant + 1 € placé sur chaque course.</p><div id="pfZone"><p class="note2">Chargement…</p></div>';
  el.querySelectorAll('[data-pj]').forEach(function(b){ b.onclick = function(){ PJauto = false; PJ = +b.getAttribute('data-pj'); perfs(el); }; });
  fetch('/api/membres/perfs?date=' + encodeURIComponent(jourFr(PJ)), {credentials:'same-origin'}).then(function(r){ return r.json(); }).then(function(d){
    var z = document.getElementById('pfZone');
    if (d.erreur) { z.innerHTML = '<p class="empty">' + d.erreur + '</p>'; return; }
    if (PJauto && PJ === 0 && d.reunions && d.reunions.length && d.reunions.every(function(r){ return r.courses.every(function(c){ return c.arrivee && c.arrivee.length; }); })) { PJauto = false; PJ = 1; perfs(el); return; }
    if (!d.reunions || !d.reunions.length) { z.innerHTML = '<p class="empty">Pas de course en France ce jour-là.</p>'; return; }
    var Fe = function(x){ return (Math.round(x * 100) / 100).toFixed(2).replace('.', ',') + ' €'; };
    var B = d.bilan, h = '';
    if (B && B.courses) h += '<section class="card" style="padding:10px 14px;margin:6px 0 12px"><b>Bilan du jour — le 1er de l\'étude, 1 € gagnant + 1 € placé</b><br>' + B.courses + ' course' + (B.courses > 1 ? 's' : '') + ' courue' + (B.courses > 1 ? 's' : '') + ' · ' + B.gagnants + ' gagnant' + (B.gagnants > 1 ? 's' : '') + ' · ' + B.places + ' placé' + (B.places > 1 ? 's' : '') + ' · mise ' + Fe(B.mise) + ' · retour ' + Fe(B.retour) + ' · net <b class="' + (B.net >= 0 ? 'pos' : 'neg') + '">' + (B.net >= 0 ? '+' : '−') + Fe(Math.abs(B.net)) + '</b></section>';
    h += d.reunions.map(function(r){
      return '<h2 style="margin:18px 0 6px">' + E2(r.h) + '</h2>' + r.courses.map(function(c){
        var arr = c.arrivee || [], top8 = c.classement.slice(0, 8).map(function(x){ return x.n; });
        var dans = arr.length ? arr.slice(0, 4).filter(function(n){ return top8.indexOf(n) >= 0; }).length : null;
        var P = c.premier;
        return '<section class="card" style="padding:12px 14px;margin:8px 0"><h3 style="margin:0 0 4px">C' + c.c + ' – ' + E2(c.nom) + '</h3>' +
          '<p style="margin:4px 0;line-height:1.9">' + c.classement.map(function(x, i){ var on = arr.slice(0, 4).indexOf(x.n) >= 0; return (i === 8 ? '<span class="note2">| </span>' : '') + '<span title="' + E2(x.nom) + ' : ' + x.perfs.join('-') + '" style="white-space:nowrap">' + (on ? '<b style="color:#c0392b">' + x.n + '</b>' : (i < 3 ? '<b>' + x.n + '</b>' : x.n)) + '<small style="color:#7a8aa6"> (' + String(x.note).replace('.', ',') + ')</small></span>'; }).join(' · ') + '</p>' +
          (arr.length ? '<p style="margin:4px 0">Arrivée : <b>' + arr.slice(0, 4).join(' - ') + '</b>' + (dans !== null ? ' <span class="note2">(' + dans + ' des 4 premiers dans les 8 de l\'étude)</span>' : '') + '</p>' : '') +
          (P ? '<p class="note2" style="margin:2px 0">Le 1er de l\'étude (' + P.n + ') : ' + (P.rang === 1 ? '<b class="pos">gagnant</b>' : P.place ? '<b class="pos">placé ' + P.rang + 'e</b>' : (P.rang ? P.rang + 'e' : 'non placé')) + ' · rapporte ' + Fe(P.gagne + P.place) + ' pour 2,00 €</p>' : '') + '</section>';
      }).join('');
    }).join('');
    z.innerHTML = h;
  }).catch(function(){ document.getElementById('pfZone').innerHTML = '<p class="empty">Données PMU indisponibles pour le moment.</p>'; });
}
var eur = function(v){ return (Math.round(v * 100) / 100).toLocaleString('fr-FR', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' €'; };
function etQuinte(el){
  el.innerHTML = '<p class="empty">Calcul en cours…</p>';
  fetch('/api/membres/etude-quinte', {credentials:'same-origin'}).then(function(r){ return r.json(); }).then(function(d){
    if (d.erreur) { el.innerHTML = '<p class="empty">' + E2(d.erreur) + '</p>'; return; }
    if (d.vide) { el.innerHTML = '<p class="empty">L\'étude arrive dès que le Quinté+ du jour est publié.</p>'; return; }
    var arr = d.arrivee || [];
    var h = '<p class="lead"><b>' + E2(d.libelle) + '</b> · ' + E2(d.hippodrome) + ' · ' + E2(d.date) + ' · ' + d.partants + ' partants</p>';
    h += '<p class="note2">Calculée automatiquement : chaque cheval avec son rang dans chaque liste N-TURF' + (d.trot ? ' et dans la formule du membre (trot)' : '') + ', et sa cote PMU. <b>Citations</b> = nombre de listes où il figure dans les 8 premiers. Les chevaux sont classés du plus cité au moins cité. 🎯 = outsider coté de 6 à 10.</p>';
    if (arr.length) h += '<div class="arrivee"><b>Arrivée</b> ' + arr.map(function(n){ return '<span class="ch hit">' + n + '</span>'; }).join('') + '</div>';
    h += '<div style="overflow-x:auto"><table class="st" style="font-size:14px"><tr><th>N°</th><th>Cheval</th><th>Cote</th>' + d.listes.map(function(l){ return '<th>' + E2(l) + '</th>'; }).join('') + '<th>Citations</th></tr>';
    h += d.lignes.map(function(x){
      var on = arr.indexOf(x.n) >= 0, st = on ? ' style="color:#c62832;font-weight:800"' : '';
      return '<tr><td' + st + '><b>' + x.n + '</b></td><td' + st + '>' + E2(x.nom) + (x.outsider ? ' 🎯' : '') + '</td><td>' + (x.cote || '–') + '</td>' + x.rangs.map(function(r){ return '<td style="text-align:center">' + (r && r <= 8 ? '<b>' + r + '</b>' : (r ? '<small>' + r + '</small>' : '–')) + '</td>'; }).join('') + '<td style="text-align:center"><b>' + x.cite + '</b> / ' + d.listes.length + '</td></tr>';
    }).join('') + '</table></div>';
    el.innerHTML = h;
  }).catch(function(){ el.innerHTML = '<p class="empty">Données PMU indisponibles pour le moment.</p>'; });
}
var OJ = 0;
function etOut(el){
  el.innerHTML = '<div class="pills" style="margin:6px 0 10px"><button type="button" class="pill'+(OJ===0?' on':'')+'" data-j="0">Aujourd\'hui ('+jourFr(0)+')</button><button type="button" class="pill'+(OJ===1?' on':'')+'" data-j="1">Demain ('+jourFr(1)+')</button></div><p class="note2">Calculée automatiquement : sur les réunions publiées en course par course et sur le Quinté+, les chevaux cotés de 6 à 10 au PMU. Bilan joué à 1 € gagnant + 1 € placé sur chacun, avec les rapports officiels du PMU. Les cotes bougent jusqu\'au départ.</p><div id="outZone"><p class="empty">Calcul en cours…</p></div>';
  el.querySelectorAll('[data-j]').forEach(function(b){ b.onclick = function(){ OJ = +b.getAttribute('data-j'); etOut(el); }; });
  fetch('/api/membres/outsiders?date=' + encodeURIComponent(jourFr(OJ)), {credentials:'same-origin'}).then(function(r){ return r.json(); }).then(function(d){
    var z = document.getElementById('outZone');
    if (d.erreur) { z.innerHTML = '<p class="empty">' + E2(d.erreur) + '</p>'; return; }
    if (!d.reunions.length) { z.innerHTML = '<p class="empty">' + (OJ === 1 ? 'Les outsiders de demain apparaissent quand les réunions sont publiées et les cotes ouvertes.' : 'Pas encore d\'outsider : les réunions ne sont pas publiées ou les cotes pas encore ouvertes.') + '</p>'; return; }
    var b = d.bilan, h = '';
    if (b.joues) h += '<section class="card" style="padding:12px 14px"><b>Bilan du jour</b> : ' + b.joues + ' outsider' + (b.joues > 1 ? 's' : '') + ' joué' + (b.joues > 1 ? 's' : '') + ' · ' + b.gagnants + ' gagnant' + (b.gagnants > 1 ? 's' : '') + ' · ' + b.places + ' placé' + (b.places > 1 ? 's' : '') + '<br>Mise ' + eur(b.mise) + ' · retour ' + eur(b.retour) + ' · net <b style="color:' + (b.net >= 0 ? '#1e8e3e' : '#c62832') + '">' + (b.net > 0 ? '+' : '') + eur(b.net) + '</b></section>';
    h += d.reunions.map(function(r){
      return '<h2 style="margin:18px 0 6px">' + E2(r.h) + '</h2>' + r.courses.map(function(c){
        return '<section class="card" style="padding:10px 14px;margin:8px 0"><h3 style="margin:0 0 4px">C' + c.c + (c.quinte ? ' · Quinté+' : '') + ' – ' + E2(c.nom) + '</h3><p class="note2" style="margin:0 0 6px">' + c.partants + ' partants' + (c.heure ? ' · ' + new Date(c.heure).toLocaleTimeString('fr-FR', {timeZone:'Europe/Paris', hour:'2-digit', minute:'2-digit'}) : '') + '</p>' +
          c.chevaux.map(function(x){
            var res = '';
            if (c.fini) res = x.gagne ? ' → <b style="color:#c62832">gagnant</b> (' + eur(x.gagne) + ' + ' + eur(x.place) + ')' : (x.place ? ' → <b style="color:#c62832">placé ' + x.rang + 'e</b> (' + eur(x.place) + ')' : ' → ' + (x.rang ? x.rang + 'e' : 'non placé'));
            return '<p style="margin:3px 0"><b>' + x.n + '</b> ' + E2(x.nom) + ' · cote ' + x.cote + res + '</p>';
          }).join('') + (c.arrivee.length ? '<div class="arrivee"><b>Arrivée</b> ' + c.arrivee.map(function(n){ return '<span class="ch' + (c.chevaux.some(function(x){ return x.n === n; }) ? ' hit' : '') + '">' + n + '</span>'; }).join('') + '</div>' : '') + '</section>';
      }).join('');
    }).join('');
    z.innerHTML = h;
  }).catch(function(){ document.getElementById('outZone').innerHTML = '<p class="empty">Données PMU indisponibles pour le moment.</p>'; });
}
var vv = function(h){ return h && h.v ? parseInt(h.v, 36) || 0 : 0; };
fetch('/api/membres/etudes', {credentials:'same-origin'})
  .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
  .then(function(d){
    // études déposées par Claude (dépôt) : on garde la plus récente des deux sources
    return fetch('/etudes-img/jour.json?t=' + Date.now(), {credentials:'same-origin'}).then(function(r){ return r.ok ? r.json() : {}; }).catch(function(){ return {}; })
      .then(function(c){ Object.keys(c || {}).forEach(function(g){ if (vv(c[g]) > vv(d[g])) { c[g].depot = 1; d[g] = c[g]; } }); return d; });
  })
  .then(function(d){
    // une étude d'un autre jour que le Quinté+ en ligne ne s'affiche plus
    var QD = d.quinteDate || '', qIso = /^\d{2}\/\d{2}\/\d{4}$/.test(QD) ? QD.split('/').reverse().join('-') : '';
    function jourEtude(h){
      if (h.date && /^\d{2}\/\d{2}\/\d{4}$/.test(h.date)) return { iso: h.date.split('/').reverse().join('-'), sur: 1 };
      var m = String(h.titre || '').match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?/);
      if (m) return { iso: (m[3] || qIso.slice(0, 4)) + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[1]).slice(-2) };
      var t = parseInt(h.v, 36); return t ? { iso: new Date(t).toLocaleDateString('fr-CA', {timeZone:'Europe/Paris'}) } : null;
    }
    if (qIso) ['etquinte', 'etr1', 'etout', 'ettrot'].forEach(function(g){ var h = d[g]; if (!h || !h.n) return; var j = jourEtude(h); if (j && (j.sur ? j.iso !== qIso : j.iso < qIso)) d[g] = null; });
    document.getElementById('zone').hidden = false;
    var el = document.getElementById('pages'), lb = document.getElementById('lb');
    function montrer(g){
      document.querySelectorAll('nav.tabs a[data-g]').forEach(function(a){ a.className = a.getAttribute('data-g') === g ? 'on' : ''; });
      var h = d[g];
      document.getElementById('titre').textContent = h && h.titre || '';
      if (g === 'ettrot') { document.getElementById('titre').textContent = ''; trot(el, null); return; }
      if (g === 'etquinte') { document.getElementById('titre').textContent = ''; etQuinte(el); return; }
      if (g === 'etout') { document.getElementById('titre').textContent = ''; etOut(el); return; }
      if (g === 'etperfs') { document.getElementById('titre').textContent = ''; perfs(el); return; }
      if (!h || !h.n) { el.innerHTML = '<p class="empty">L\'étude du jour arrive.</p>'; return; }
      var t = ''; for (var i = 0; i < h.n; i++) t += '<img class="hpage" loading="lazy" src="'+(h.depot ? '/etudes-img/'+g+'-'+(i+1)+'.jpg?v='+encodeURIComponent(h.v) : '/api/membres/hippo-image?g='+g+'&i='+i+'&v='+encodeURIComponent(h.v||''))+'" alt="Étude '+(i+1)+'">';
      el.innerHTML = t;
      el.querySelectorAll('img').forEach(function(im){ im.onclick = function(){ lb.querySelector('img').src = im.src; lb.hidden = false; }; });
    }
    lb.onclick = function(){ lb.hidden = true; };
    document.querySelectorAll('nav.tabs a[data-g]').forEach(function(a){ a.onclick = function(e){ e.preventDefault(); montrer(a.getAttribute('data-g')); history.replaceState(null, '', '#' + a.getAttribute('data-g')); }; });
    var hh = location.hash.slice(1); montrer(['etout','ettrot','etperfs'].indexOf(hh) >= 0 ? hh : 'etquinte');
  }).catch(function(){ document.getElementById('refus').hidden = false; });
</script>
</body>
</html>
