<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pronos Hippodrome – N-TURF</title>
<meta name="theme-color" content="#0D1E3D">
<link rel="manifest" href="/manifest.webmanifest?v=2">
<link rel="icon" href="/icone-nturf-192.png">
<link rel="stylesheet" href="/style.css?v=20261127a">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4848326247118929" crossorigin="anonymous"></script>
</head>
<body data-page="membres">
<main>
<h1>Pronos Hippodrome</h1>
<div id="refus" class="note" hidden>🔒 Réservé aux membres. <a href="/inscription.html">S'inscrire gratuitement</a> ou <a href="/inscription.html#connexion">se connecter</a>.</div>
<div id="zone" hidden>
<nav class="tabs" style="padding:0 0 10px"><a href="#quinte" data-g="quinte" class="on">Quinté+</a><a href="#pick5" data-g="pick5">Super Pick 5</a></nav>
<p class="lead" id="titre"></p>
<div id="pages"></div>
<p class="note2">Touche une page pour l'agrandir.</p>
<p class="note2" id="pubH" hidden><a href="/admin-hippodrome.html">✍ Publier mes pages</a> · <a href="/admin-hippodrome.html?demain=1">Préparer demain</a></p>
</div>
</main>
<div id="lb" hidden><img alt=""></div>
<script src="/site.js?v=20261127c"></script>
<script>
NTURF_MOI.then(function(m){ if (m.connecte && m.hippo) document.getElementById('pubH').hidden = false; });
fetch('/api/membres/hippo', {credentials:'same-origin'})
  .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
  .then(function(d){
    document.getElementById('zone').hidden = false;
    var el = document.getElementById('pages'), lb = document.getElementById('lb');
    function montrer(g){
      document.querySelectorAll('nav.tabs a[data-g]').forEach(function(a){ a.className = a.getAttribute('data-g') === g ? 'on' : ''; });
      var h = d[g];
      document.getElementById('titre').textContent = h && h.titre || '';
      if (!h || !h.n) { el.innerHTML = '<p class="empty">Les pages du jour arrivent.</p>'; return; }
      var t = ''; for (var i = 0; i < h.n; i++) t += '<img class="hpage" loading="lazy" src="/api/membres/hippo-image?g='+g+'&i='+i+'&v='+encodeURIComponent(h.v||'')+'" alt="Page '+(i+1)+'">';
      el.innerHTML = t;
      el.querySelectorAll('img').forEach(function(im){ im.onclick = function(){ lb.querySelector('img').src = im.src; lb.hidden = false; }; });
    }
    lb.onclick = function(){ lb.hidden = true; };
    document.querySelectorAll('nav.tabs a[data-g]').forEach(function(a){ a.onclick = function(e){ e.preventDefault(); montrer(a.getAttribute('data-g')); history.replaceState(null, '', '#' + a.getAttribute('data-g')); }; });
    montrer(location.hash === '#pick5' ? 'pick5' : 'quinte');
  }).catch(function(){ document.getElementById('refus').hidden = false; });
</script>
</body>
</html>
