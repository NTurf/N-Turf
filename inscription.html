<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inscription – N-TURF</title>
<meta name="theme-color" content="#0D1E3D">
<link rel="manifest" href="/manifest.webmanifest?v=2">
<link rel="icon" href="/icone-nturf-192.png">
<link rel="stylesheet" href="/style.css?v=20261128c">
</head>
<body data-page="inscription">
<main>
<nav class="tabs" style="padding:0 0 10px">
  <a href="#" id="tInsc" class="on">Créer un compte</a>
  <a href="#" id="tConn">Se connecter</a>
</nav>

<section class="card" id="bInsc">
<h1 style="margin-top:0">Inscription</h1>
<p class="lead">Gratuite. Elle donne accès à l'espace membres et aux concours.</p>
<form id="fInsc">
<label for="iPseudo">Pseudo (unique, visible des autres membres)</label>
<input id="iPseudo" autocomplete="nickname" maxlength="20" required>
<label for="iEmail">Adresse e-mail (jamais affichée)</label>
<input id="iEmail" type="email" autocomplete="email" required>
<label for="iPass">Mot de passe (8 caractères minimum)</label>
<div class="mdp"><input id="iPass" type="password" autocomplete="new-password" minlength="8" required><button type="button" class="voir" data-for="iPass">Afficher</button></div>
<label style="display:flex;gap:10px;align-items:flex-start;color:var(--txt)"><input id="iMaj" type="checkbox" style="width:auto;margin-top:4px">
<span>Je suis majeur et j'accepte la <a href="/confidentialite.html">politique de confidentialité</a>.</span></label>
<p id="mInsc" class="msg"></p>
<button class="btn" type="submit">Créer mon compte</button>
</form>
</section>

<section class="card" id="bConn" hidden>
<h1 style="margin-top:0">Connexion</h1>
<form id="fConn">
<label for="cLogin">Pseudo ou adresse e-mail</label>
<input id="cLogin" autocomplete="username" required>
<label for="cPass">Mot de passe</label>
<div class="mdp"><input id="cPass" type="password" autocomplete="current-password" required><button type="button" class="voir" data-for="cPass">Afficher</button></div>
<p id="mConn" class="msg"></p>
<button class="btn" type="submit">Se connecter</button>
</form>
<p style="margin:12px 0 0;line-height:2"><a href="/oubli.html">Mot de passe ou pseudo oublié ?</a></p>
</section>
<p class="note2" style="text-align:center">Un souci pour t'inscrire ou te connecter ? <a href="mailto:n.turf.contact@gmail.com">Contactez-nous : n.turf.contact@gmail.com</a></p>
</main>
<script src="/site.js?v=20261128a"></script>
<script>
document.querySelectorAll('.voir').forEach(function(b){
  b.onclick = function(){ var i = document.getElementById(b.getAttribute('data-for')), cache = i.type === 'password'; i.type = cache ? 'text' : 'password'; b.textContent = cache ? 'Masquer' : 'Afficher'; };
});
function show(insc){
  document.getElementById('bInsc').hidden=!insc; document.getElementById('bConn').hidden=insc;
  document.getElementById('tInsc').className=insc?'on':''; document.getElementById('tConn').className=insc?'':'on';
}
document.getElementById('tInsc').onclick=function(e){e.preventDefault();show(true)};
document.getElementById('tConn').onclick=function(e){e.preventDefault();show(false)};
if(location.hash==='#connexion') show(false);

function send(url,body,msgId,btn){
  var m=document.getElementById(msgId); m.className='msg'; m.textContent='Un instant…'; btn.disabled=true;
  fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)})
  .then(function(r){return r.json().then(function(d){return {ok:r.ok,st:r.status,d:d}})})
  .then(function(x){
    if(x.ok){ m.className='msg ok'; m.textContent='Bienvenue '+x.d.pseudo+' !'; setTimeout(function(){location.href='/membres.html'},700); }
    else { m.className='msg err'; m.textContent=x.d.erreur||'Une erreur est survenue.'; btn.disabled=false;
      if (msgId==='mConn' && x.st===401) m.innerHTML += '<br><small style="font-weight:normal">Ton téléphone a peut-être gardé ton mot de passe sous l\'ancienne adresse <b>n-turf.pages.dev</b> : regarde dans tes mots de passe enregistrés. <a href="/oubli.html">Comment faire ?</a></small>'; }
  }).catch(function(){ m.className='msg err'; m.textContent='Connexion impossible, réessayez.'; btn.disabled=false; });
}
document.getElementById('fInsc').onsubmit=function(e){
  e.preventDefault();
  send('/api/inscription',{pseudo:iPseudo.value,email:iEmail.value,password:iPass.value,majeur:iMaj.checked},'mInsc',e.submitter||this.querySelector('button[type=submit]'));
};
document.getElementById('fConn').onsubmit=function(e){
  e.preventDefault();
  send('/api/connexion',{login:cLogin.value,password:cPass.value},'mConn',e.submitter||this.querySelector('button[type=submit]'));
};
</script>
</body>
</html>
