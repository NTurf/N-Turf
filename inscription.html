<head>
<meta charset="utf-8">

<body data-page="inscription">
<main>
<h1>Inscription</h1>
<p class="lead">L'inscription est gratuite. Elle donne accès à l'espace membres et aux concours.</p>
<div class="note">Les inscriptions ouvrent très bientôt.</div>
<section class="card">
<form onsubmit="return false">
<label>Pseudo (unique, visible des autres membres)</label><input disabled placeholder="Votre pseudo">
<label>Adresse e-mail (jamais affichée)</label><input disabled type="email" placeholder="vous@exemple.fr">
<label>Mot de passe</label><input disabled type="password" placeholder="••••••••">
<p style="color:var(--soft);font-size:14px">Réservé aux personnes majeures. En vous inscrivant, vous acceptez la <a href="/confidentialite.html">politique de confidentialité</a>.</p>
<button class="btn" disabled style="opacity:.5">Créer mon compte</button>
</form>
<p style="margin-top:16px;color:var(--soft)">Déjà membre ? La connexion se fera ici aussi.</p>
</section>
</main>
<script src="/site.js"></script>
</body>
</html>
