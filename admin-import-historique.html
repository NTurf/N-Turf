<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Import de l'historique – N-TURF</title>
<meta name="robots" content="noindex"><link rel="icon" href="/icon-192.png"><link rel="stylesheet" href="/style.css"></head>
<body data-page="admin"><main><h1>Historique des tickets</h1>
<div id="refus" class="note" hidden>Réservé à l'administrateur.</div>
<section class="card" id="zone" hidden>
<p>Ce bouton reprend dans le site les tickets publiés sur l'ancienne page : <b>22/11</b> (avec l'arrivée et les rapports) et <b>23/11</b> (le jour même). À faire une seule fois.</p>
<p><button class="btn" id="go">Importer l'historique</button></p><p class="msg" id="msg"></p></section></main>
<script src="/site.js"></script>
<script>
var DATA = {"tickets-2026-11-22": {"date": "22/11/2026", "tickets": [{"id": "h0", "auteur": "N-TURF", "pari": "Tiercé", "formule": "positions", "spec": [14, 16, "X"], "chevaux": [], "bases": [], "mise": 1, "associes": [1, 5, 6, 7, 8, 10, 11, 12, 14, 15, 16, 17]}, {"id": "h1", "auteur": "N-TURF", "pari": "Tiercé", "formule": "positions", "spec": [16, "X", 15], "chevaux": [], "bases": [], "mise": 1, "associes": [1, 5, 6, 7, 8, 10, 11, 12, 14, 15, 16, 17]}, {"id": "h2", "auteur": "N-TURF", "pari": "Quarté+", "formule": "positions", "spec": [14, 16, "X", 15], "chevaux": [], "bases": [], "mise": 1.5, "associes": [1, 5, 6, 7, 8, 10, 11, 12, 14, 15, 16, 17]}, {"id": "h3", "auteur": "N-TURF", "pari": "Quarté+", "formule": "positions", "spec": [16, "X", 15, 10], "chevaux": [], "bases": [], "mise": 1.5, "associes": [1, 5, 6, 7, 8, 10, 11, 12, 14, 15, 16, 17]}, {"id": "h4", "auteur": "N-TURF", "pari": "Quinté+", "formule": "positions", "spec": [16, 14, "X", 15, 10], "chevaux": [], "bases": [], "mise": 2, "associes": [1, 5, 6, 7, 8, 10, 11, 12, 14, 15, 16, 17]}]}, "quinte-2026-11-22": {"date": "22/11/2026", "partants": 18, "arrivee": [14, 10, 8, 1, 16], "rapports": {"Tiercé ordre": 1138.5, "Tiercé désordre": 187.4, "Quarté ordre": 7022.5, "Quarté désordre": 552.1, "Quarté bonus 3": 38, "Quinté ordre": 21073.2, "Quinté désordre": 209.9, "Quinté bonus 4": 5.9, "Quinté bonus 4 sur 5": 5.9, "Quinté bonus 3": 5.1}}, "tickets-2026-11-23": {"date": "23/11/2026", "tickets": [{"id": "h10", "auteur": "N-TURF", "pari": "Tiercé", "formule": "positions", "spec": [14, 12, "X"], "chevaux": [], "bases": [], "mise": 1, "associes": [2, 3, 5, 6, 7, 9, 11, 12, 13, 14, 16, 17]}, {"id": "h11", "auteur": "N-TURF", "pari": "Tiercé", "formule": "positions", "spec": [3, 13, "X"], "chevaux": [], "bases": [], "mise": 1, "associes": [2, 3, 5, 6, 7, 9, 11, 12, 13, 14, 16, 17]}, {"id": "h12", "auteur": "N-TURF", "pari": "Quarté+", "formule": "positions", "spec": [9, 14, "X", 13], "chevaux": [], "bases": [], "mise": 1.5, "associes": [2, 3, 5, 6, 7, 9, 11, 12, 13, 14, 16, 17]}, {"id": "h13", "auteur": "N-TURF", "pari": "Quarté+", "formule": "positions", "spec": [12, 3, "X", 9], "chevaux": [], "bases": [], "mise": 1.5, "associes": [2, 3, 5, 6, 7, 9, 11, 12, 13, 14, 16, 17]}, {"id": "h14", "auteur": "N-TURF", "pari": "Quinté+", "formule": "positions", "spec": [13, 12, "X", 3, 14], "chevaux": [], "bases": [], "mise": 2, "associes": [2, 3, 5, 6, 7, 9, 11, 12, 13, 14, 16, 17]}]}};
NTURF_MOI.then(function(m){
  if (!(m.connecte && m.role === 'admin')) { document.getElementById('refus').hidden = false; return; }
  document.getElementById('zone').hidden = false;
  document.getElementById('go').onclick = function(){
    var b = this, msg = document.getElementById('msg'); b.disabled = true;
    Object.keys(DATA).reduce(function(p, k){ return p.then(function(){
      return fetch('/api/admin/contenu', { method: 'POST', headers: {'content-type':'application/json'}, body: JSON.stringify({ cle: k, data: DATA[k] }) })
        .then(function(r){ if (!r.ok) throw new Error(k); });
    }); }, Promise.resolve())
    .then(function(){ msg.className = 'msg ok'; msg.innerHTML = 'Historique importé. <a href="/stats.html">Voir les statistiques</a>'; })
    .catch(function(e){ msg.className = 'msg err'; msg.textContent = 'Erreur sur ' + e.message + ', réessaie.'; b.disabled = false; });
  };
});
</script></body></html>
